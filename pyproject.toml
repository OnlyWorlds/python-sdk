[project]
name = "onlyworlds"
readme = "README.md"
dynamic = ["version"]
description = "OnlyWorlds for Python: the world folder format (read, write, push) and a client for the v2 API."
requires-python = ">=3.12"
license = "MIT"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://onlyworlds.github.io/docs/development/python"
Source = "https://github.com/OnlyWorlds/python-sdk"
Issues = "https://github.com/OnlyWorlds/python-sdk/issues"
Changelog = "https://github.com/OnlyWorlds/python-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
okf = ["PyYAML>=6"]       # onlyworlds.okf, the OKF bundle export; the core imports no YAML

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",          # codegen imports the vendored schema walk; tests/test_okf.py needs it too
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/onlyworlds/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/onlyworlds"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["codegen/schema-dist", "codegen/tools", "src/onlyworlds/_schema.py", "src/onlyworlds/_tools.py", "src/onlyworlds/_walk"]  # the vendored dist and tools list, the copied checker and the generated modules keep their own shape

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "codegen/generate_schema.py", "codegen/generate_tools.py"]
exclude = ["src/onlyworlds/_walk/"]  # the dist's checker, copied byte for byte
