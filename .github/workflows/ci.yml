name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy --strict src
      - run: uv run python codegen/generate_schema.py --check
