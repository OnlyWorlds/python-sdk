name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    # A commit message is published text too: the commits this push or pull request adds name no one
    # inside the team and point at no internal room or tracker, like the tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/public_words.py --commits "$RANGE"
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event.before && !startsWith(github.event.before, '0000000') && format('{0}..{1}', github.event.before, github.sha)) || github.sha }}

  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src tests
      - run: uv run python codegen/generate_schema.py --check
      - run: uv run python codegen/generate_tools.py --check
      # Published text names no one inside the team and points at no internal room or tracker.
      - run: uv run python scripts/public_words.py

  wire:
    # keel's own OpenAPI document and the public demo world, read only. Red here with
    # the gates above green means the server moved under the client, not that a change broke it.
    runs-on: ubuntu-latest
    env:
      OW_OPENAPI: https://www.onlyworlds.com/api/v2/openapi.json
      OW_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q tests/test_wire.py tests/test_live.py
